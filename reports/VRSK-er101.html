.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mute)}

/* ============================ helpers ============================ */
const $=s=>document.querySelector(s);
const n=(v,d=1)=>v==null||!isFinite(v)?"n/a":v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
